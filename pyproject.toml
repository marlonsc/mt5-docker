[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
exclude = [
    "typings/",
    "docker/container/metatrader/mt5_pb2\\.py$",
    "docker/container/metatrader/mt5_pb2_grpc\\.py$",
]
python_version = "3.13"
strict = true
no_implicit_reexport = false

[[tool.mypy.overrides]]
module = ["MetaTrader5"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "mt5_pb2",
    "mt5_pb2_grpc",
    "*.mt5_pb2",
    "*.mt5_pb2_grpc",
    "mt5linux.mt5_pb2",
    "mt5linux.mt5_pb2_grpc",
]
ignore_errors = true
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["bridge", "*.bridge", "*._generated_protocols"]
disallow_subclassing_any = false
disable_error_code = ["name-defined", "misc"]

[[tool.mypy.overrides]]
module = ["conftest", "*.conftest"]
warn_return_any = false


[tool.poetry]
authors = ["marlonsc <marlonsc@gmail.com>"]
description = "Dockerized MetaTrader 5 environment with gRPC bridge"
license = "MIT"
name = "mt5docker"
package-mode = false
readme = "README.md"
version = "2.2.1"

[tool.poetry.dependencies]
grpcio = "^1.60.0"
mt5linux = { git = "https://github.com/marlonsc/mt5linux.git", branch = "master" }
python = ">=3.13,<3.14"
python-dotenv = "^1.0.0"

[tool.poetry.group.dev.dependencies]
grpc-stubs = ">=1.53.0.6,<2.0.0.0"
hypothesis = "^6.148.7"
mypy = "^1.0.0"
pyright = "^1.1.0"
pytest = "^8.0.0"
pytest-dotenv = "^0.5.0"
pytest-timeout = "^2.0.0"
ruff = "0.11.13"

[tool.pyrefly]
project-excludes = [
    "docker/container/metatrader/mt5_pb2.py",
    "docker/container/metatrader/mt5_pb2_grpc.py",
]
search-path = [".", "docker/container"]
ignore-missing-imports = ["MetaTrader5"]
python-version = "3.13"

[tool.pyright]
exclude = [
    "**/mt5_pb2.py",
    "**/mt5_pb2_grpc.py",
    "../.venv",
    "../.venv/**",
    "**/.venv",
    "**/.venv/**",
    "**/venv",
    "**/venv/**",
    "**/site-packages",
    "**/site-packages/**",
]
ignore = [
    "../.venv",
    "../.venv/**",
    "**/.venv",
    "**/.venv/**",
    "**/venv",
    "**/venv/**",
    "**/site-packages",
    "**/site-packages/**",
]
pythonPlatform = "Linux"
pythonVersion = "3.13"
venvPath = ".."
venv = ".venv"
useLibraryCodeForTypes = true
typeCheckingMode = "strict"
executionEnvironments = [{ root = ".", extraPaths = ["docker/container"] }]

[tool.pytest.ini_options]
addopts = "-v --tb=short -s"
env_files = [".env"]
markers = [
    "requires_container: marks tests that require the Docker container to be running",
    "slow: marks tests that may take longer to execute",
]
testpaths = ["tests"]
timeout = 600

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
exclude = [
    "*.pyi",
    "docker/container/metatrader/mt5_pb2.py",
    "docker/container/metatrader/mt5_pb2_grpc.py",
    "typings/",
]
ignore = ["COM812", "ISC001", "D203", "D213", "N802"]
select = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S101",   # assert ok in tests
    "S603",   # subprocess calls ok in tests (Docker interaction)
    "S607",   # partial executable path ok in tests (docker CLI)
    "SLF001",
    "TRY300", # try/except style ok in tests
]
"docker/container/metatrader/_generated_protocols.py" = [
    "FBT001",  # boolean positional args mirror generated protobuf message factories
    "FBT002",  # boolean defaults are required by the generated gRPC message API
    "N815",    # mixedCase names are inherited from gRPC generated symbols
    "N816",    # mixedCase names are inherited from gRPC generated symbols
    "PLR0913", # protocol factory signatures mirror protobuf message fields
    "TC002",   # grpc is imported at runtime for protocol base classes
    "TC003",   # standard-library types are used at runtime by protocol machinery
]
"docker/container/metatrader/bridge.py" = [
    "ARG002",  # unused arguments are required by gRPC framework (request, context)
    "N802",    # function names must be PascalCase for gRPC service methods
    "PLW0603", # global statement needed for server lifecycle management
    "S104",    # binding to all interfaces is intentional for gRPC server
    "TC002",   # numpy is imported at runtime because typed annotations need it
]
"tests/test_bridge_validation.py" = [
    "PT019",   # fixture without value injected as parameter - test setup requirement
    "S105",    # hardcoded password - test token for controlled testing
    "S108",    # hardcoded temp file - test token file in /tmp for restart tests
    "PT018",   # composite assertion - complex validation in single assertion
    "PLR2004", # magic value comparison - specific length validation in tests
]
"tests/generated_protocols.py" = [
    "D101",    # protocol message classes are self-describing by their names
    "D102",    # protocol method signatures are self-describing
    "FBT001",  # boolean positional args mirror generated protobuf message factories
    "FBT002",  # boolean defaults are required by the generated gRPC message API
    "PLR0913", # protocol factory signatures mirror protobuf message fields
    "TC002",   # grpc is imported at runtime for protocol base classes
    "TC003",   # standard-library types are used at runtime by protocol machinery
]
